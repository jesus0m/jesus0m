name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jesus0m
          outputs: |
            dist/github-snake.svg?palette=github
            dist/github-snake-dark.svg?color_snake=%2338BDF8&color_dots=%230f172a,%231e293b,%232563eb,%236366f1,%2306b6d4

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
